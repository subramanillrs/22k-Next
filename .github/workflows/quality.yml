name: Frontend and pipeline checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pipeline dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Run market-data and layout checks
        run: |
          python tests/test_quant_pipeline.py
          python tests/test_mobile_alignment.py

      - name: Run client, calculator, and Worker tests
        run: |
          node -e 'global.print = console.log; require("./tests/test_ml_engine.js"); require("./tests/test_schemes.js"); require("./tests/test_ui_navigation.js"); require("./tests/test_feature_parity.js")'
          node tests/test_local_tools.js
          node tests/test_live_price_worker.mjs

      - name: Check JavaScript syntax and JSON payloads
        run: |
          for file in js/*.js workers/live-prices/src/*.mjs sw.js; do node --check "$file"; done
          python -c 'import json,pathlib; files=list(pathlib.Path("data").glob("*.json")); [json.loads(p.read_text(encoding="utf-8")) for p in files]; print(f"Validated {len(files)} JSON data files")'
